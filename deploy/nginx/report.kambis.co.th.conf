# report.kambis.co.th — คอนฟิกที่ใช้งานจริง
#
# ก๊อปทับไฟล์เดิมได้เลย แล้ว `sudo nginx -t && sudo systemctl reload nginx`
#
# อิงจากของเดิมทุกบรรทัด (ชื่อโดเมน · พาธใบรับรอง · ปลายทาง 172.30.108.66:4446
# · ค่า buffer ที่ตั้งไว้) แล้วเติมเฉพาะส่วนที่ขาด ซึ่งมีสามกลุ่ม:
#
#   1. timeout      → ต้นเหตุของ HTTP 504
#   2. หัว X-Forwarded-*  → **อันตรายกว่า 504** ดูคำอธิบายในบล็อกด้านล่าง
#   3. /api/progress → SSE ของหน้าจอโหลด
#
# โครงนี้ nginx อยู่ **คนละเครื่อง** กับแอป (proxy_pass ไป IP ภายใน)
# แปลว่าพอร์ต 4446 ต้องเปิดสู่วงแลน → **ต้องปิดด้วย firewall ให้รับเฉพาะ IP
# ของเครื่อง nginx** ไม่งั้นใครที่เข้าถึงวงแลนได้ก็ข้าม nginx เข้าตรงได้
# (ยังต้องล็อกอินอยู่ แต่ไม่มี https และคุกกี้ไม่ติดธง Secure)

upstream kambis_app {
    server 172.30.108.66:4446;

    # ใช้คอนเนกชันซ้ำ ลดการจับมือ TCP ทุกคำขอ
    # ต้องมาคู่กับ proxy_http_version 1.1 + Connection "" ด้านล่าง
    # ฝั่ง Node ตั้ง keepAliveTimeout = 65s ไว้ให้ยาวกว่า 60 วินาทีนี้แล้ว
    # (ถ้าฝั่ง Node สั้นกว่า จะได้ 502 เป็นระยะแบบสุ่มโดยที่ log สองฝั่งดูปกติ)
    keepalive 16;
    keepalive_timeout 60s;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────
server {
    listen 80;
    server_name report.kambis.co.th www.report.kambis.co.th;

    # `return` ทำงานก่อน `location` เสมอ — บล็อก location ในไฟล์เดิม
    # จึงเป็นโค้ดที่ไม่มีวันถูกเรียก ตัดออกได้
    return 301 https://report.kambis.co.th$request_uri;
}

# ── www → ไม่มี www ──────────────────────────────────────────
#
# ของเดิมรับ www ไว้ในบล็อก 443 ด้วย ซึ่งจะเสิร์ฟเว็บตรง ๆ ไม่ redirect
# คุกกี้ session ผูกกับโฮสต์ (ไม่ได้ตั้ง Domain) คนที่เผลอเข้า www จึงได้คุกกี้
# คนละใบ แล้วสลับไปมาระหว่างสองที่อยู่จะเหมือนถูกเด้งออกจากระบบ
server {
    listen 443 ssl;
    server_name www.report.kambis.co.th;

    ssl_certificate     /etc/nginx/file/kambis/081225/fullchain.pem;
    ssl_certificate_key /etc/nginx/file/kambis/081225/STAR_kambis_co_th.key;

    return 301 https://report.kambis.co.th$request_uri;
}

# ── ตัวจริง ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name report.kambis.co.th;

    ssl_certificate     /etc/nginx/file/kambis/081225/fullchain.pem;
    ssl_certificate_key /etc/nginx/file/kambis/081225/STAR_kambis_co_th.key;
    # ssl_trusted_certificate /etc/nginx/file/ca-bundle.crt;

    # คำขอที่ใหญ่ที่สุดคือใบขอซื้อ ซึ่งตัวแอปจำกัดไว้ที่ 256 KB อยู่แล้ว
    # (ของเดิมตั้ง 0 = ไม่จำกัด ซึ่งไม่จำเป็นและเปิดช่องให้ยิงคำขอใหญ่ ๆ ใส่)
    client_max_body_size 1m;
    client_header_buffer_size 128k;
    large_client_header_buffers 4 32k;

    # ── timeout: ต้นเหตุของ 504 ──────────────────────────────
    #
    # รอบโหลดเต็มดึง Google Sheets 137 แท็บ วัดจริงได้ 17–58 วินาที
    # และเคยถึง ~3 นาทีตอน Google ช้า ค่าเริ่มต้นของ nginx คือ 60 วินาที
    # จึงตัดสายกลางคันแล้วผู้ใช้เห็น 504 ทั้งที่เซิร์ฟเวอร์ยังทำงานอยู่
    #
    # ตัวแอปกันไว้อีกชั้นแล้ว (เสิร์ฟชุดเดิมทันทีแล้วดึงใหม่เบื้องหลัง)
    # แต่ปุ่ม "รีเฟรชข้อมูล" ที่ผู้ใช้กดเองยังรอของจริงเสมอโดยตั้งใจ
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://kambis_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # ── สองหัวนี้ขาดแล้วเจ็บกว่า 504 ──────────────────────
        #
        # X-Forwarded-For: clientIp() ใช้จำกัดจำนวนครั้งที่เดารหัสผ่านต่อ IP
        #   ไม่ส่งมา = ทุกคนกลายเป็น IP ของ nginx เหมือนกันหมด แล้ว
        #   **คนเดียวพิมพ์รหัสผิด 5 ครั้ง จะล็อกทุกคนออกจากระบบ 15 นาที**
        #
        # X-Forwarded-Proto: isSecureRequest() ใช้ตัดสินว่าจะติดธง Secure
        #   ให้คุกกี้ session ไหม ไม่ส่งมา = **คุกกี้ไม่ติดธง Secure ทั้งที่วิ่งบน https**
        #
        # ต้องตั้ง TRUST_PROXY=1 ใน .env ของแอปคู่กันเสมอ —
        # ใส่หัวอย่างเดียวไม่พอ ตั้ง env อย่างเดียวก็ไม่พอ
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffers 8 32k;
        proxy_buffer_size 32k;
    }

    # ── SSE ของหน้าจอโหลด ────────────────────────────────────
    #
    # ต้องปิด buffering ไม่งั้นหน้าจอ "กำลังโหลดข้อมูล" จะค้างที่ 0%
    # แล้วกระโดดไป 100% ทีเดียวตอนจบ ซึ่งผู้ใช้อ่านว่าเว็บค้าง
    #
    # โค้ดส่งหัว X-Accel-Buffering: no มาให้แล้ว และ nginx เคารพหัวนั้น
    # แต่เขียนกำกับไว้ตรงนี้ด้วยเพื่อไม่ให้ขึ้นกับหัวเดียว — โดยเฉพาะเมื่อ
    # บล็อกด้านบนตั้ง proxy_buffers ไว้ ซึ่งเป็นการเปิด buffering ชัดเจน
    location /api/progress {
        proxy_pass http://kambis_app;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
