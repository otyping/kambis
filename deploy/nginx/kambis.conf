# Kambis Executive Report Dashboard — nginx reverse proxy (แม่แบบทั่วไป)
#
# ไฟล์นี้เขียนไว้สำหรับกรณี **nginx อยู่เครื่องเดียวกับแอป** (proxy_pass ไป 127.0.0.1)
#
# ของจริงที่ใช้อยู่ตอนนี้ nginx อยู่คนละเครื่อง — ดูตัวที่ก๊อปไปวางทับได้เลยที่
# `deploy/nginx/report.kambis.co.th.conf` ซึ่งมีพาธใบรับรองและ IP ปลายทางจริงแล้ว
#
# วางไว้ที่ /etc/nginx/sites-available/kambis.conf แล้ว symlink ไป sites-enabled/
# จากนั้นออกใบรับรองด้วย  certbot --nginx -d dashboard.example.com
# (certbot จะเติมบล็อก ssl_* กับ redirect 80→443 ให้เอง)
#
# แทนที่ dashboard.example.com ด้วย subdomain จริงทุกจุด

upstream kambis_app {
    server 127.0.0.1:5173;

    # คงคอนเนกชันไว้ใช้ซ้ำ ลดการจับมือ TCP ใหม่ทุกคำขอ
    # ต้องมาคู่กับ proxy_http_version 1.1 + Connection "" ด้านล่าง
    # และ Node ฝั่งโน้นตั้ง keepAliveTimeout = 65s ไว้ให้ยาวกว่า 60 วินาทีนี้แล้ว
    # (ถ้าฝั่ง Node สั้นกว่า จะได้ 502 เป็นระยะแบบสุ่มโดยที่ log ทั้งสองฝั่งดูปกติ)
    keepalive 16;
    keepalive_timeout 60s;
}

server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;

    # certbot จะเข้ามาแทนที่บรรทัดนี้ด้วย redirect ไป https ให้เอง
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.example.com;

    # ssl_certificate / ssl_certificate_key — certbot เติมให้

    # ใบขอซื้อและไฟล์ Excel ที่ส่งกลับมีขนาดหลัก KB
    # คำขอที่เข้ามาถูกจำกัดไว้ที่ 256 KB โดยตัวเซิร์ฟเวอร์เองอยู่แล้ว (readJsonBody)
    client_max_body_size 1m;

    # ── ค่าที่โปรเจกต์นี้ต้องการเป็นพิเศษ ────────────────────────────
    # รอบโหลดเต็มดึง Google Sheets หลายร้อยแท็บ วัดจริงตอน Google ช้าใช้ถึง ~3 นาที
    # ค่าเริ่มต้นของ nginx คือ 60 วินาที ซึ่งจะตัดสายกลางคันแล้วผู้ใช้เห็น 504
    # ทั้งที่เซิร์ฟเวอร์ยังทำงานอยู่และกำลังจะเสร็จ
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;

    location / {
        proxy_pass http://kambis_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # คู่กับ TRUST_PROXY=1 — ใช้จำกัดจำนวนครั้งที่เดารหัสผ่านต่อ IP
        # ไม่ส่งมา = ทุกคนกลายเป็น IP เดียวกัน แล้วคนเดียวพิมพ์ผิดจะล็อกทุกคน
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # ทำให้คุกกี้ session ติดธง Secure (isSecureRequest อ่านหัวนี้)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SSE ความคืบหน้าการโหลด ──────────────────────────────────────
    # ถ้าปล่อยให้ nginx buffer ไว้ หน้าจอ "กำลังโหลด" จะค้างที่ 0% แล้วกระโดดไป 100%
    # ทีเดียวตอนจบ ซึ่งผู้ใช้อ่านว่าเว็บค้าง (โค้ดส่ง X-Accel-Buffering: no มาให้แล้ว
    # แต่เขียนกำกับไว้ตรงนี้ด้วยเพื่อไม่ให้ขึ้นกับหัวเดียว)
    location /api/progress {
        proxy_pass http://kambis_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }
}
